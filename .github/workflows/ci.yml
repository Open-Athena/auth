name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      # `node:sqlite` (used by the D1 adapter tests) needs Node ≥ 22.5.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The demo consumes the built package, so this also checks the exports map.
      - run: pnpm --filter @open-athena/auth-demo typecheck
      - run: pnpm --filter @open-athena/auth-demo exec vite build

  # Publish a `dist` branch consumable by SHA — the distribution channel until
  # this is stable enough for npm (see specs/overview.md).
  #
  # Gated on `test` rather than running as its own workflow: consumers pin dist
  # SHAs, so the dist branch must never advance past a commit whose tests fail.
  # A pinned-but-broken SHA is the one failure mode this model has.
  dist:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: runsascoded/npm-dist@v1
        with:
          node_version: '24'
          build_command: pnpm build
          # `exports` points at ./dist/*, so keep the directory rather than
          # letting the build output flatten to the branch root.
          preserve_dirs: dist
          # Migrations are public surface (`./migrations/*`) but aren't build
          # output, so they have to be carried over explicitly.
          extra_files: >-
            migrations/0001_grants.sql,migrations/0002_access_log.sql,migrations/0003_access_requests.sql,migrations/0004_access_log_daily.sql,README.md
          # `pnpm.onlyBuiltDependencies` is a workspace-dev concern (esbuild,
          # workerd); it means nothing to a consumer.
          pkg_exclude: pnpm
