# OA's sign-in broker: an OIDC provider (`@open-athena/auth/provider`) over a
# Google-only gate restricted to the openathena.ai Workspace. See README.md.
name = "oa-login"
main = "src/index.ts"
compatibility_date = "2026-06-01"
workers_dev = false

# Creates the DNS record and certificate on deploy.
routes = [{ pattern = "login.oa.dev", custom_domain = true }]

# From `scripts/oa-wrangler.sh d1 create oa-login`.
# Local dev doesn't need it: `wrangler dev` uses a local SQLite file.
[[d1_databases]]
binding = "DB"
database_name = "oa-login"
database_id = "90240ead-6119-4f86-967d-f2526baf7908"
migrations_dir = "../migrations"

[vars]
# Who may sign in: Google accounts whose id_token carries this Workspace `hd`.
WORKSPACE_DOMAIN = "openathena.ai"
# Who may use /admin (comma-separated).
ADMIN_EMAILS = "ryan.williams@openathena.ai"
# Callbacks /admin and scripts/oa-client.mjs accept must be https under this (or loopback).
CLIENT_REDIRECT_DOMAIN = "oa.dev"
# Hosts (comma-separated) whose one-label subdomains a preview client may cover with a
# `https://*.<host>/<path>` callback: Cloudflare Pages projects' branch hosts, for PR previews.
# Only that project's deployments serve under `<project>.pages.dev`. Adding one is a reviewed deploy.
PREVIEW_HOST_SUFFIXES = ""

# Secrets (`scripts/oa-wrangler.sh secret put <NAME>`):
#   SESSION_SECRET        - HMAC key for the broker's session cookie, state and subject ids
#   OIDC_SIGNING_KEY      - private RS256 JWK (`../scripts/oidc-signing-key.mjs | scripts/oa-wrangler.sh secret put OIDC_SIGNING_KEY`)
#   GOOGLE_CLIENT_ID      - Google OAuth "Web application" client, callback https://login.oa.dev/auth/google/callback
#   GOOGLE_CLIENT_SECRET
# Optional (disabled when absent):
#   CLIENT_MANAGEMENT_GRANTS - JSON array of hash-only, expiring per-app capabilities; see ../docs/client-management.md
