name = "oa-auth-demo"
compatibility_date = "2026-06-01"
# Passed on the deploy command instead of set here: declaring it makes
# `wrangler pages dev -- <cmd>` refuse to proxy Vite ("cannot specify both a
# directory and a proxy command"), which would cost HMR in local dev.

# `database_id` is filled in by `wrangler d1 create oa-auth-demo` (see README).
# Local dev doesn't need it: `wrangler pages dev` uses a local SQLite file.
[[d1_databases]]
binding = "DB"
database_name = "oa-auth-demo"
database_id = "84d1f21d-2d54-4b30-ae43-2712ab44f0db"
migrations_dir = "../migrations"

[vars]
# The Zero Trust team domain whose JWTs `/auth/sso` will accept. Only the
# `/auth/sso` path is Access-gated; everything else is public at the edge.
ACCESS_TEAM_DOMAIN = "https://openathena-ai-pages.cloudflareaccess.com"
# Domain whose SSO identities are treated as staff.
STAFF_DOMAIN = "openathena.ai"

# Secrets (set with `wrangler pages secret put <NAME>`):
#   SESSION_SECRET  - HMAC key for session cookies and IP hashing
#   ACCESS_AUD      - the Access application's AUD tag
